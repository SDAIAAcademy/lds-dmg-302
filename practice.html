<section>
<h2>اليوم 1: من النص الضعيف إلى المتطلب المتتبَّع</h2>
<ol>
<li><p>في جامعة افتراضية، وثيقة عنوانها «إرشادات أرشفة سجلات الطلاب» تقول: «يجب نقل ملف الطالب إلى الأرشيف خلال 30 يومًا من تخرجه، ويجب ألا تتجاوز نسبة الملفات المتأخرة 2% في كل فصل». اعتمدها مدير الأرشيف.</p><ul><li><b>أ.</b> إرشاد، فهذا عنوانها ومدير الأرشيف أصدرها</li><li><b>ب.</b> إجراء، فهي تصف ما يفعله موظف الأرشيف في كل ملف يصل إليه من الكليات</li><li><b>ج.</b> معيار، ويُعتمد بمسار المعايير في الجامعة لا بتوقيع مدير الأرشيف وحده</li><li><b>د.</b> سياسة، فهي تفرض التزامًا على الجامعة كلها</li></ul></li>
<li><p>في مستشفى افتراضي، العبارة الأصلية: «تُراجع صلاحيات الأنظمة دوريًا وتُلغى غير اللازمة». أربع صياغات مقترحة.</p><ul><li><b>أ.</b> تُراجع صلاحيات الأنظمة دوريًا وفق الإجراءات المعتمدة</li><li><b>ب.</b> يراجع مدير الأنظمة الصلاحيات كل ربع سنة، ويلغي غير المستخدم منها، ويبلغ الإدارة بالنتيجة في تقرير مكتوب</li><li><b>ج.</b> ينبغي على مديري الأقسام مراجعة الصلاحيات كل ربع سنة</li><li><b>د.</b> يراجع مدير الأنظمة صلاحيات كل حساب مرة كل ربع سنة، ويسجل النتيجة في تقرير مراجعة الصلاحيات</li></ul></li>
<li><p>في هيئة نقل افتراضية، الالتزام «تُعدّ الجهة جدولًا لمدد الاحتفاظ وتراجعه سنويًا». الكتالوج فيه متطلب «يعدّ مدير الوثائق جدول الاحتفاظ»، ولا متطلب يذكر المراجعة.</p><ul><li><b>أ.</b> تغطية جزئية، وملاحظة بأن المراجعة السنوية بلا متطلب ولا مالك</li><li><b>ب.</b> تغطية كاملة، فالمتطلب يتحدث عن جدول الاحتفاظ نفسه، ومالكه معروف في الهيئة</li><li><b>ج.</b> لا تغطية، فالمتطلب لا يطابق نص الالتزام حرفيًا</li><li><b>د.</b> تغطية كاملة بعد إضافة متطلب ثالث عن الإتلاف</li></ul></li>
<li><p>في دليل وحدة الأسطول لدى جهة نقل افتراضية فقرة نصها: «1) يسجّل السائق قراءة العداد. 2) يفحص الإطارات. 3) يوقّع نموذج التسليم.» في أي نوع من وثائق الحوكمة مكانها؟</p><ul><li><b>أ.</b> سياسة</li><li><b>ب.</b> معيار</li><li><b>ج.</b> إجراء</li><li><b>د.</b> إرشاد</li></ul></li>
<li><p>العبارة التي تبدأ «يُستحسن أن...» وتترك القرار للموظف مكانها الإرشاد لا المعيار.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>وجدت في الخريطة وثيقة عنوانها «سياسة الطباعة» بلا رقم إصدار ولا مالك ولا تاريخ مراجعة، ومحتواها سليم. ما الذي تسجله لها؟</p><ul><li><b>أ.</b> لا شيء، فالمحتوى سليم، والملاحظات في الخريطة للمحتوى وحده</li><li><b>ب.</b> ملاحظة ضبط وثائق: لا إصدار ولا مالك ولا موعد مراجعة</li><li><b>ج.</b> تعارضًا مع السياسة الأعلى منها في تسلسل الوثائق، يُرفع إلى اللجنة</li><li><b>د.</b> أنها إجراء لا سياسة، فتُنقل إلى قسم الإجراءات في الخريطة</li></ul></li>
<li><p>تقول سياسة أمن المعلومات لجهة افتراضية إن صلاحيات الأنظمة تُراجع كل ربع سنة، ويقول إجراء الموارد البشرية إنها تُراجع مرة في السنة. ما الأصح أن تسجله في خريطة الوثائق؟</p><ul><li><b>أ.</b> تعارضًا يُرفع إلى مالك الضابط ليقرره، ويُصحَّح النص الآخر</li><li><b>ب.</b> اعتماد الإجراء، فهو الأقرب إلى التنفيذ اليومي ويعرفه الموظفون أكثر</li><li><b>ج.</b> اعتماد المدة الأقصر، فهي الأشد حماية، وتعديل الإجراء ليوافقها</li><li><b>د.</b> لا شيء، فكل وثيقة تملكها وحدة مختلفة ولها أن تقرر في نطاقها</li></ul></li>
<li><p>عبارة في سياسة سجلات مستشفى افتراضي: «يجب الحفاظ على سرية ملفات المرضى بشكل مناسب.» أي إعادة صياغة تجتاز قائمة التحقق للصياغة؟</p><ul><li><b>أ.</b> تلتزم الجهة بحماية سرية ملفات المرضى حماية تامة في كل وحداتها وأنظمتها الورقية والإلكترونية.</li><li><b>ب.</b> يحافظ الموظفون على السرية، ويبلغون عن الحوادث خلال يوم، ويحضرون التدريب السنوي، ويوقعون الإقرار.</li><li><b>ج.</b> يجب على الجميع الحرص على السرية قدر الإمكان.</li><li><b>د.</b> يراجع مدير السجلات الطبية صلاحيات نظام الملفات كل ربع سنة، ويحفظ محضر المراجعة.</li></ul></li>
<li><p>كلمة «ينبغي» في متطلب معيار تعني ما تعنيه «يجب».</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>متطلب في مكتبة عامة افتراضية: «يرسل منسق الإعارة إشعار تأخير لكل مستعير خلال ثلاثة أيام عمل من تاريخ الاستحقاق.» ما الدليل الذي يفحصه المدقق؟</p><ul><li><b>أ.</b> سجل الإشعارات بتواريخها، مقارنًا بتواريخ الاستحقاق</li><li><b>ب.</b> إقرار مكتوب من منسق الإعارة كل شهر بأنه أرسل الإشعارات كلها في وقتها</li><li><b>ج.</b> عدد شكاوى المستعيرين في السنة</li><li><b>د.</b> نص سياسة الإعارة الذي ورد فيه المتطلب، معتمدًا وعليه رقم الإصدار</li></ul></li>
<li><p>عبارة: «تُشفَّر النسخ الاحتياطية وتُختبر استعادتها.» كيف تعيد صياغتها؟</p><ul><li><b>أ.</b> تُترك كما هي، فهي قصيرة وواضحة ولا تحتاج إلى أكثر من ذلك</li><li><b>ب.</b> تُكتب متطلبًا واحدًا وتُضاف إليه «بانتظام» ليصير فيه مقياس</li><li><b>ج.</b> تُقسم متطلبين، لكل منهما مالك ومقياس ودليل</li><li><b>د.</b> تُنقل إلى الإرشاد، فلا أحد يستطيع أن يقيس التشفير والاستعادة</li></ul></li>
<li><p>أعد فريق مصفوفة تبدأ من كل التزام في المراجع الخارجية وتذكر المتطلبات التي تغطيه، ولم يقرأها في الاتجاه الآخر. ما الذي قد يفوته؟</p><ul><li><b>أ.</b> الالتزامات التي لا يغطيها أي متطلب</li><li><b>ب.</b> المتطلبات الداخلية التي لا مصدر لها</li><li><b>ج.</b> الالتزامات المغطاة تغطية جزئية</li><li><b>د.</b> المراجع الخارجية التي لم تُذكر في الكتالوج</li></ul></li>
<li><p>قبل نقل مصدر ذكره الكتالوج لمتطلب إلى المصفوفة، يُفتح النص المذكور ويُتحقق أنه يقول ما نُسب إليه.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>التزام في نظام افتراضي: «تُتلف البيانات بعد انتهاء الغرض، ويُوثَّق الإتلاف.» والمتطلب الداخلي: «يتلف مدير السجلات الملفات المنتهي غرضها كل ستة أشهر.» كيف تُقدَّر التغطية؟</p><ul><li><b>أ.</b> كاملة، فالمتطلب يذكر الإتلاف</li><li><b>ب.</b> لا تغطية، فالمتطلب يذكر مدة ستة أشهر لا يذكرها الالتزام أصلًا</li><li><b>ج.</b> جزئية، وتُكتب في الملاحظة أن توثيق الإتلاف غير مغطى</li><li><b>د.</b> لا تُقدَّر حتى يُعدَّل الالتزام الخارجي ليوافق ما تفعله الجهة فعلًا</li></ul></li>
<li><p>في كتالوج جهة افتراضية متطلب يحدد خط التقارير الداخلية وحجمه، ولا مصدر له في أي مرجع خارجي. ما القرار الصحيح؟</p><ul><li><b>أ.</b> يُحذف فورًا، فكل متطلب ليس له مصدر في نص خارجي زائد على الحاجة</li><li><b>ب.</b> يُنسب إلى أقرب مرجع وطني في الموضوع ليمر في المصفوفة دون فراغ</li><li><b>ج.</b> يُترك بلا قرار، فلا يضر أحدًا</li><li><b>د.</b> يُسجَّل قرار: مصدر داخلي يُذكر، أو إلغاء بقرار اللجنة</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: معيار الذكاء الاصطناعي التوليدي: صياغة وتشاور وتحديث</h2>
<ol>
<li><p>في بلدية افتراضية، متطلب «يطبع مكتب الرخص كل رخصة على ورق مختوم». لا يظهر في أي سطر من مصفوفة التتبع، ولا مصدر له في المراجع الخارجية.</p><ul><li><b>أ.</b> يُلغى فورًا، فكل متطلب لا يظهر في المصفوفة زائد</li><li><b>ب.</b> يُسأل عن مصدره: قرار داخلي يُسجل رقمه، أو نص آخر، وإلا يُعرض للإلغاء بقرار</li><li><b>ج.</b> يُنسب إلى أقرب التزام في المصفوفة</li><li><b>د.</b> يبقى كما هو، فهو لا يخالف شيئًا</li></ul></li>
<li><p>في هيئة نقل افتراضية، كتب مساعد في مسودة المعيار: «تجيز مبادئ أخلاقيات الذكاء الاصطناعي ترتيب الركاب آليًا بحسب سلوكهم لتحديد أولوية الخدمة».</p><ul><li><b>أ.</b> تقبله كما هو، فالمساعد نسبه إلى مبادئ وطنية منشورة</li><li><b>ب.</b> تقبله بعد موافقة رئيس الهيئة على الترتيب</li><li><b>ج.</b> تحذفه وتسجله «يناقض المصدر»</li><li><b>د.</b> تعيد صياغته بفاعل ومقياس ودليل ليصير قابلًا للاختبار</li></ul></li>
<li><p>شركة مياه افتراضية، استثناء من قاعدتها «لا ترجمة آلية للرسائل» لمكتب خدمة العملاء.</p><ul><li><b>أ.</b> خمسة وأربعون يومًا، ومراجعة بشرية لكل رسالة، ويقيّمه الأمن وتعتمده اللجنة، ويُعاد فتحه عند أي شكوى</li><li><b>ب.</b> يُسمح به حتى إشعار آخر، مع مراجعة بشرية لكل رسالة قبل إرسالها، ويقيّمه الأمن وتعتمده لجنة البيانات في الشركة</li><li><b>ج.</b> خمسة وأربعون يومًا، بشرط تدريب الموظفين على أمن المعلومات</li><li><b>د.</b> خمسة وأربعون يومًا، ومراجعة بشرية، ويعتمده مدير خدمة العملاء نفسه</li></ul></li>
<li><p>يجوز لمعيار جهة حكومية أن يسمح بإدخال بيانات مصنفة «مقيد» في أداة ذكاء اصطناعي توليدي إن وقّعت الجهة عقدًا مع المزود.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مكتب رخص البناء في بلدية افتراضية يستعمل أداة تقترح قبول الطلب أو رفضه. أي متطلب يعبّر عن الإشراف البشري؟</p><ul><li><b>أ.</b> تُعرض توصية الأداة على مقدم الطلب مع القرار.</li><li><b>ب.</b> لا يُرفض طلب رخصة إلا بقرار مهندس مختص يُسجَّل اسمه وسبب قراره، ولو أوصت الأداة بالرفض.</li><li><b>ج.</b> تُراجع دقة الأداة مرة في السنة بعينة من الطلبات، ويُرفع تقرير إلى المدير.</li><li><b>د.</b> يُستعمل في الأداة أحدث نموذج متاح.</li></ul></li>
<li><p>أعد مساعد مسودة معيار لمكتب رخص البناء، وفيها مرجع لا يعرفه أحد في الفريق. ما الخطوة الأولى؟</p><ul><li><b>أ.</b> يبقى المرجع كما هو، فالمساعد اطلع على نصوص أكثر مما اطلع عليه الفريق</li><li><b>ب.</b> يُسأل المساعد نفسه هل المرجع صحيح، ويُعتمد جوابه إن أكد ذلك</li><li><b>ج.</b> يُفتح النص الرسمي، وتُسجَّل النتيجة، ويُحذف المرجع إن لم يثبت</li><li><b>د.</b> يُستبدل به مرجع وطني معروف في الموضوع نفسه، ليبقى للنص سند</li></ul></li>
<li><p>وافقت إدارة خدمة العملاء في جهة افتراضية على استثناء من متطلب داخلي، وفي السجل: الطالب، والمتطلب، والسبب، والموافِق. ما الذي ينقص السجل؟</p><ul><li><b>أ.</b> اسم المساعد أو الأداة التي صاغت نص الطلب، وتاريخ الصياغة</li><li><b>ب.</b> توقيع المدير العام على كل استثناء مهما صغر أثره</li><li><b>ج.</b> نسخة كاملة من نص المتطلب الأصلي المستثنى منه</li><li><b>د.</b> المدة، وموعد المراجعة، والضابط التعويضي</li></ul></li>
<li><p>يجوز أن يعتمد مقدم طلب الاستثناء طلبه بنفسه إذا كان أعلى رتبة ممن قيّم المخاطر.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أي مما يلي موجب لمراجعة معيار استخدام الذكاء الاصطناعي قبل موعده الدوري؟</p><ul><li><b>أ.</b> صدور تعديل على نص وطني يستند إليه المعيار</li><li><b>ب.</b> انتقال مالك المعيار إلى مكتب آخر في المبنى</li><li><b>ج.</b> مرور شهر على اعتماد المعيار دون أي ملاحظة عليه</li><li><b>د.</b> شكوى من طول المعيار</li></ul></li>
<li><p>الضابط التعويضي يقلل الخطر نفسه الذي كان المتطلب المستثنى منه يعالجه، ولا يكفي أن يكون ضابطًا آخر أيًّا كان.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في جولة تشاور على معيار جهة افتراضية، طلب ممثل الأعمال حذف متطلب، ورفضه الفريق. ما الذي يُكتب في سجل الملاحظات؟</p><ul><li><b>أ.</b> القرار «رفض» وحده</li><li><b>ب.</b> القرار وسببه والنص الذي يستند إليه، ويُبلغ صاحب الملاحظة</li><li><b>ج.</b> لا شيء، فالسجل للملاحظات المقبولة</li><li><b>د.</b> اسم من رفض الملاحظة</li></ul></li>
<li><p>قالت اللجنة الصورية إن متطلبًا في معيارك لا يمكن اختباره. ما أفضل رد؟</p><ul><li><b>أ.</b> تشرح للجنة أن نية المتطلب واضحة لكل من يقرأ المعيار بحسن نية</li><li><b>ب.</b> تعد بتعديله بعد اللجنة وإرسال النص الجديد إليها خلال أسبوع</li><li><b>ج.</b> تحذفه من المعيار، فلا يُسأل عنه أحد بعد اليوم</li><li><b>د.</b> تعدله أمامها بمالك ومقياس ودليل، وتحدّث سطره في المصفوفة وسجل الإصدارات</li></ul></li>
</ol>

ance":null,"unit":null,"explanation":"غياب الإصدار والمالك وموعد المراجعة ملاحظة ضبط وثائق مستقلة عن جودة المحتوى؛ دونها لا يُعرف النص النافذ ولا المسؤول عن تحديثه.","misconceptions":["يحكم على الوثيقة بمحتواها وحده وينسى أن ضبط الوثيقة جزء من حوكمتها.","","يسمي كل خلل تعارضًا، والتعارض نصان يقولان شيئين مختلفين في الأمر نفسه.","ينقل النوع دون أن يقرأ المحتوى، والسؤال عن ضبطها لا عن نوعها."],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-dmg302-04","type":"single","prompt":"تقول سياسة أمن المعلومات لجهة افتراضية إن صلاحيات الأنظمة تُراجع كل ربع سنة، ويقول إجراء الموارد البشرية إنها تُراجع مرة في السنة. ما الأصح أن تسجله في خريطة الوثائق؟","options":[{"key":"أ","text":"تعارضًا يُرفع إلى مالك الضابط ليقرره، ويُصحَّح النص الآخر"},{"key":"ب","text":"اعتماد الإجراء، فهو الأقرب إلى التنفيذ اليومي ويعرفه الموظفون أكثر"},{"key":"ج","text":"اعتماد المدة الأقصر، فهي الأشد حماية، وتعديل الإجراء ليوافقها"},{"key":"د","text":"لا شيء، فكل وثيقة تملكها وحدة مختلفة ولها أن تقرر في نطاقها"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"نصان يحكمان الأمر نفسه بمدتين مختلفتين تعارض يُسجل ويُرفع؛ لا يحسمه كاتب الخريطة بنفسه ولا يُترك.","misconceptions":["","يجعل الأدنى في التسلسل يغلب الأعلى، والإجراء ينفذ السياسة ولا يعدلها.","يحل التعارض بقرار فردي من كاتب الخريطة بدل أن يرفعه إلى مالك الضابط.","يظن أن اختلاف الوحدة المالكة يجيز اختلاف الحكم في الأمر نفسه."],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-dmg302-05","type":"single","prompt":"عبارة في سياسة سجلات مستشفى افتراضي: «يجب الحفاظ على سرية ملفات المرضى بشكل مناسب.» أي إعادة صياغة تجتاز قائمة التحقق للصياغة؟","options":[{"key":"أ","text":"تلتزم الجهة بحماية سرية ملفات المرضى حماية تامة في كل وحداتها وأنظمتها الورقية والإلكترونية."},{"key":"ب","text":"يحافظ الموظفون على السرية، ويبلغون عن الحوادث خلال يوم، ويحضرون التدريب السنوي، ويوقعون الإقرار."},{"key":"ج","text":"يجب على الجميع الحرص على السرية قدر الإمكان."},{"key":"د","text":"يراجع مدير السجلات الطبية صلاحيات نظام الملفات كل ربع سنة، ويحفظ محضر المراجعة."}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المتطلب القابل للاختبار فيه التزام واحد، ومالك من جدول الأدوار، ومقياس (كل ربع سنة)، ودليل يفحصه المدقق (محضر المراجعة).","misconceptions":["يجعل «الجهة» فاعلًا، فلا يُعرف من يُسأل، ويبقي «تامة» بلا مقياس.","يجمع ثلاثة التزامات في متطلب واحد، فلا يُختبر كل منها وحده.","يبقي ألفاظًا تُفشل التدقيق: «الجميع» و«قدر الإمكان».",""],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-dmg302-06","type":"tf","prompt":"كلمة «ينبغي» في متطلب معيار تعني ما تعنيه «يجب».","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"في لغة المتطلبات «ينبغي» توصية يجوز تركها بسبب موثق، و«يجب» إلزام؛ من أراد الإلزام كتب «يجب» أو فعلًا مضارعًا ملزمًا.","misconceptions":["يعامل صيغ الإلزام كلها معاملة واحدة، فيكتب «ينبغي» ويظن أن المدقق سيعدها إلزامًا.",""],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-dmg302-07","type":"single","prompt":"متطلب في مكتبة عامة افتراضية: «يرسل منسق الإعارة إشعار تأخير لكل مستعير خلال ثلاثة أيام عمل من تاريخ الاستحقاق.» ما الدليل الذي يفحصه المدقق؟","options":[{"key":"أ","text":"سجل الإشعارات بتواريخها، مقارنًا بتواريخ الاستحقاق"},{"key":"ب","text":"إقرار مكتوب من منسق الإعارة كل شهر بأنه أرسل الإشعارات كلها في وقتها"},{"key":"ج","text":"عدد شكاوى المستعيرين في السنة"},{"key":"د","text":"نص سياسة الإعارة الذي ورد فيه المتطلب، معتمدًا وعليه رقم الإصدار"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الدليل أثر يمكن فحصه يثبت التنفيذ والمقياس معًا: سجل بتواريخ يقارن بموعد الاستحقاق.","misconceptions":["","يقبل التصريح بدل الأثر، والإقرار لا يثبت أن الإشعار أُرسل في موعده.","يقيس نتيجة بعيدة يمكن أن تتأثر بغير الإشعار، لا تنفيذ المتطلب نفسه.","يخلط بين المصدر والدليل؛ النص يقول ما يجب، والدليل يثبت أنه حدث."],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-dmg302-08","type":"single","prompt":"عبارة: «تُشفَّر النسخ الاحتياطية وتُختبر استعادتها.» كيف تعيد صياغتها؟","options":[{"key":"أ","text":"تُترك كما هي، فهي قصيرة وواضحة ولا تحتاج إلى أكثر من ذلك"},{"key":"ب","text":"تُكتب متطلبًا واحدًا وتُضاف إليه «بانتظام» ليصير فيه مقياس"},{"key":"ج","text":"تُقسم متطلبين، لكل منهما مالك ومقياس ودليل"},{"key":"د","text":"تُنقل إلى الإرشاد، فلا أحد يستطيع أن يقيس التشفير والاستعادة"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"في العبارة التزامان مختلفان قد يملكهما دوران مختلفان ولكل منهما دليل؛ يُقسَّم كل التزام في متطلب يُختبر وحده.","misconceptions":["يعد القصر وضوحًا، والعبارة بلا فاعل ولا مقياس.","يضيف لفظًا يُفشل التدقيق ويبقي التزامين في سطر واحد.","","يهرب من الصياغة بدل أن يضيف المقياس، والتشفير والاستعادة قابلان للقياس."],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-dmg302-09","type":"single","prompt":"أعد فريق مصفوفة تبدأ من كل التزام في المراجع الخارجية وتذكر المتطلبات التي تغطيه، ولم يقرأها في الاتجاه الآخر. ما الذي قد يفوته؟","options":[{"key":"أ","text":"الالتزامات التي لا يغطيها أي متطلب"},{"key":"ب","text":"المتطلبات الداخلية التي لا مصدر لها"},{"key":"ج","text":"الالتزامات المغطاة تغطية جزئية"},{"key":"د","text":"المراجع الخارجية التي لم تُذكر في الكتالوج"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الاتجاه من الالتزام إلى المتطلب يكشف الالتزام المكشوف؛ والمتطلب الذي لا يظهر في أي سطر لا يُرى إلا بالقراءة من المتطلب إلى مصدره.","misconceptions":["هذا بالضبط ما يكشفه الاتجاه الذي قرأه الفريق.","","تظهر في الاتجاه نفسه حين يُقرأ نص المتطلب بجانب الالتزام.","لا يكشفها أي اتجاه في المصفوفة، فهي خارج ما بُنيت عليه."],"lo":["LO3"],"day":1,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-dmg302-10","type":"tf","prompt":"قبل نقل مصدر ذكره الكتالوج لمتطلب إلى المصفوفة، يُفتح النص المذكور ويُتحقق أنه يقول ما نُسب إليه.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"عمود المصدر في الكتالوج ادعاء يُفحص لا حقيقة تُنسخ؛ المصدر الخطأ يجعل التزامًا يبدو مغطى وهو مكشوف.","misconceptions":["","يظن أن ما في الكتالوج صحيح لأن مكتبًا معتمدًا كتبه، فينسخ أخطاءه إلى المصفوفة."],"lo":["LO3"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-dmg302-11","type":"single","prompt":"التزام في نظام افتراضي: «تُتلف البيانات بعد انتهاء الغرض، ويُوثَّق الإتلاف.» والمتطلب الداخلي: «يتلف مدير السجلات الملفات المنتهي غرضها كل ستة أشهر.» كيف تُقدَّر التغطية؟","options":[{"key":"أ","text":"كاملة، فالمتطلب يذكر الإتلاف"},{"key":"ب","text":"لا تغطية، فالمتطلب يذكر مدة ستة أشهر لا يذكرها الالتزام أصلًا"},{"key":"ج","text":"جزئية، وتُكتب في الملاحظة أن توثيق الإتلاف غير مغطى"},{"key":"د","text":"لا تُقدَّر حتى يُعدَّل الالتزام الخارجي ليوافق ما تفعله الجهة فعلًا"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"يغطي المتطلب عنصرًا من عنصري الالتزام؛ فالتغطية جزئية، والملاحظة تقول ما ينقص ليُكتب له متطلب أو يُعدَّل.","misconceptions":["يقرأ الكلمة المشتركة لا عناصر الالتزام كلها.","يظن أن زيادة المتطلب في التفصيل تنفي التغطية.","","ينسى أن الالتزام الخارجي لا تعدله الجهة؛ تعدل متطلبها."],"lo":["LO3"],"day":1,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-dmg302-12","type":"single","prompt":"في كتالوج جهة افتراضية متطلب يحدد خط التقارير الداخلية وحجمه، ولا مصدر له في أي مرجع خارجي. ما القرار الصحيح؟","options":[{"key":"أ","text":"يُحذف فورًا، فكل متطلب ليس له مصدر في نص خارجي زائد على الحاجة"},{"key":"ب","text":"يُنسب إلى أقرب مرجع وطني في الموضوع ليمر في المصفوفة دون فراغ"},{"key":"ج","text":"يُترك بلا قرار، فلا يضر أحدًا"},{"key":"د","text":"يُسجَّل قرار: مصدر داخلي يُذكر، أو إلغاء بقرار اللجنة"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المتطلب بلا مصدر خارجي يحتاج قرارًا مسجلًا: إما أن مصدره قرار داخلي يُذكر، وإما أن يُلغى بقرار؛ ولا يُنسب إلى نص لا يقوله.","misconceptions":["يظن أن المصدر الوحيد المقبول نص خارجي، وللجهة أن تقرر قواعدها.","يخترع مصدرًا ليملأ الخانة، وهو أسوأ من ترك الخانة فارغة.","يبقي متطلبًا يُدقق عليه دون أن يعرف أحد لماذا وُجد.",""],"lo":["LO3"],"day":1,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-dmg302-13","type":"tf","prompt":"يجوز لمعيار جهة حكومية أن يسمح بإدخال بيانات مصنفة «مقيد» في أداة ذكاء اصطناعي توليدي إن وقّعت الجهة عقدًا مع المزود.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"مبادئ الذكاء الاصطناعي التوليدي للجهات الحكومية تمنع إدخال ما يُصنف «مقيد» فأعلى وتقصر الاستخدام على البيانات «العامة»؛ ومعيار الجهة يزيد على ذلك ولا ينقص منه.","misconceptions":["يظن أن العقد مع المزود يرفع القيد الوطني، وقاعدة الجهة لا تنقض نصًا وطنيًا.",""],"lo":["LO5"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-dmg302-14","type":"single","prompt":"مكتب رخص البناء في بلدية افتراضية يستعمل أداة تقترح قبول الطلب أو رفضه. أي متطلب يعبّر عن الإشراف البشري؟","options":[{"key":"أ","text":"تُعرض توصية الأداة على مقدم الطلب مع القرار."},{"key":"ب","text":"لا يُرفض طلب رخصة إلا بقرار مهندس مختص يُسجَّل اسمه وسبب قراره، ولو أوصت الأداة بالرفض."},{"key":"ج","text":"تُراجع دقة الأداة مرة في السنة بعينة من الطلبات، ويُرفع تقرير إلى المدير."},{"key":"د","text":"يُستعمل في الأداة أحدث نموذج متاح."}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الإشراف البشري يعني أن إنسانًا مختصًا يتخذ القرار الذي يمس الشخص ويُسجل ذلك، والأداة توصي فقط.","misconceptions":["يجعل الإفصاح بديلًا عن الإشراف، والقرار ما زال للأداة.","","يراقب الأداة إجمالًا ولا يمنع قرارًا آليًا في طلب بعينه.","يخلط بين جودة النموذج والإشراف عليه."],"lo":["LO5"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-dmg302-15","type":"single","prompt":"أعد مساعد مسودة معيار لمكتب رخص البناء، وفيها مرجع لا يعرفه أحد في الفريق. ما الخطوة الأولى؟","options":[{"key":"أ","text":"يبقى المرجع كما هو، فالمساعد اطلع على نصوص أكثر مما اطلع عليه الفريق"},{"key":"ب","text":"يُسأل المساعد نفسه هل المرجع صحيح، ويُعتمد جوابه إن أكد ذلك"},{"key":"ج","text":"يُفتح النص الرسمي، وتُسجَّل النتيجة، ويُحذف المرجع إن لم يثبت"},{"key":"د","text":"يُستبدل به مرجع وطني معروف في الموضوع نفسه، ليبقى للنص سند"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"كل مرجع في مسودة أعدها مساعد يُتحقق منه في النص الرسمي، وتُسجل النتيجة، ويُحذف أو يُصحح ما لم يثبت.","misconceptions":["يثق بالمساعد في ما يُعرف عنه أنه يختلق فيه.","يطلب من مصدر الخطأ أن يصححه، والمساعد قد يؤكد ما اختلقه.","","يغير المرجع دون أن يتحقق أن الجديد يقول ما نُسب إليه."],"lo":["LO5"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-dmg302-16","type":"single","prompt":"وافقت إدارة خدمة العملاء في جهة افتراضية على استثناء من متطلب داخلي، وفي السجل: الطالب، والمتطلب، والسبب، والموافِق. ما الذي ينقص السجل؟","options":[{"key":"أ","text":"اسم المساعد أو الأداة التي صاغت نص الطلب، وتاريخ الصياغة"},{"key":"ب","text":"توقيع المدير العام على كل استثناء مهما صغر أثره"},{"key":"ج","text":"نسخة كاملة من نص المتطلب الأصلي المستثنى منه"},{"key":"د","text":"المدة، وموعد المراجعة، والضابط التعويضي"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"الاستثناء بلا مدة ولا مراجعة ولا ضابط تعويضي يصير قاعدة دائمة غير مكتوبة؛ تحدده المدة والشروط والضابط البديل.","misconceptions":["يضيف حقلًا لا يغير شيئًا في ضبط الاستثناء.","يرفع الموافقة إلى أعلى بدل أن يحدد مدة الاستثناء وشروطه.","المتطلب معروف بمعرّفه؛ الذي ينقص هو ما يحد الاستثناء.",""],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-dmg302-17","type":"tf","prompt":"يجوز أن يعتمد مقدم طلب الاستثناء طلبه بنفسه إذا كان أعلى رتبة ممن قيّم المخاطر.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الفصل بين المهام يجعل الطالب والمقيّم والمعتمد ثلاثة أدوار مختلفة؛ الرتبة لا تجيز لأحد أن يعتمد طلبه.","misconceptions":["يظن أن الرتبة الأعلى تغني عن الفصل بين المهام.",""],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-dmg302-18","type":"single","prompt":"أي مما يلي موجب لمراجعة معيار استخدام الذكاء الاصطناعي قبل موعده الدوري؟","options":[{"key":"أ","text":"صدور تعديل على نص وطني يستند إليه المعيار"},{"key":"ب","text":"انتقال مالك المعيار إلى مكتب آخر في المبنى"},{"key":"ج","text":"مرور شهر على اعتماد المعيار دون أي ملاحظة عليه"},{"key":"د","text":"شكوى من طول المعيار"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"تغير النص الذي يستند إليه المعيار يجعل بعض متطلباته أو استثناءاته غير صالحة؛ فهو موجب للمراجعة قبل موعدها.","misconceptions":["","يخلط بين تغير المكان وتغير الدور؛ الموجب تغير المالك نفسه لا مكانه.","يجعل كل مدة قصيرة موجبًا، والمراجعة الدورية لها موعد محدد.","يعد ملاحظة على الأسلوب تغييرًا في الأساس الذي بُني عليه المعيار."],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-dmg302-19","type":"tf","prompt":"الضابط التعويضي يقلل الخطر نفسه الذي كان المتطلب المستثنى منه يعالجه، ولا يكفي أن يكون ضابطًا آخر أيًّا كان.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الضابط التعويضي يعوض الحماية التي فقدها الاستثناء؛ ضابط في موضوع آخر لا يعوض شيئًا.","misconceptions":["","يظن أن أي ضابط إضافي يبرر الاستثناء ولو عالج خطرًا مختلفًا."],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-dmg302-20","type":"single","prompt":"في جولة تشاور على معيار جهة افتراضية، طلب ممثل الأعمال حذف متطلب، ورفضه الفريق. ما الذي يُكتب في سجل الملاحظات؟","options":[{"key":"أ","text":"القرار «رفض» وحده"},{"key":"ب","text":"القرار وسببه والنص الذي يستند إليه، ويُبلغ صاحب الملاحظة"},{"key":"ج","text":"لا شيء، فالسجل للملاحظات المقبولة"},{"key":"د","text":"اسم من رفض الملاحظة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"لكل ملاحظة في السجل قرار (قبول، أو قبول مع تعديل، أو رفض) وسببه والنص الذي تغير أو الذي منع التغيير.","misconceptions":["يسجل القرار دون سببه، فلا يستطيع صاحب الملاحظة ولا اللجنة مراجعته.","","يخفي الملاحظات المرفوضة، وهي أكثر ما تسأل عنه اللجنة.","يركز على الشخص لا على سبب القرار."],"lo":["LO5"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-dmg302-21","type":"single","prompt":"قالت اللجنة الصورية إن متطلبًا في معيارك لا يمكن اختباره. ما أفضل رد؟","options":[{"key":"أ","text":"تشرح للجنة أن نية المتطلب واضحة لكل من يقرأ المعيار بحسن نية"},{"key":"ب","text":"تعد بتعديله بعد اللجنة وإرسال النص الجديد إليها خلال أسبوع"},{"key":"ج","text":"تحذفه من المعيار، فلا يُسأل عنه أحد بعد اليوم"},{"key":"د","text":"تعدله أمامها بمالك ومقياس ودليل، وتحدّث سطره في المصفوفة وسجل الإصدارات"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"الدفاع الجيد يجعل المتطلب قابلًا للاختبار في الحال، ويحافظ على أثره في المصفوفة وسجل الإصدارات.","misconceptions":["يدافع عن النية، واللجنة تسأل عن الاختبار.","يؤجل ما يطلبه التقييم أمام اللجنة نفسها.","يتخلص من الالتزام بدل أن يجعله قابلًا للاختبار، فيبقى الالتزام مكشوفًا.",""],"lo":["LO5"],"day":2,"session":2,"slide":null,"level":"evaluate","pool":"practice"}]}</script>
